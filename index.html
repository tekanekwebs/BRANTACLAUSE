<!doctype html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 0;
                font:
                    14px -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #fff;
                color: #000;
            }
            img {
                max-width: 100%;
            }
            [hidden]:not([hidden="until-found" i]) {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <title>The Branti-establishment</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,600&family=Mountains+of+Christmas:wght@700&display=swap"
            rel="stylesheet"
        />
        <style>
            /* Layout: sticky site header over one compact hero. Left: crossed-out Ho Ho Ho, Branta's No! No! No!, a small pointing Santa over the button.
   Right: a smaller Branta photo. Motion: staggered load-in and a slow float; off for reduced motion. Single dark look by choice. */
            :root {
                --bg: #091510;
                --ink: #fff6e5;
                --muted: rgba(255, 246, 229, 0.7);
                --red: #c42f29;
                --red-hot: #f25c4f;
                --gold: #f2c14e;
                --line: rgba(255, 246, 229, 0.16);
                --display: "Fraunces", Georgia, serif;
                --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
                --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
                --bar: 78px;
                color-scheme: dark;
            }
            html {
                scroll-behavior: smooth;
                scroll-padding-top: var(--bar);
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--body);
                font-size: 16px;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0 0 auto;
                height: env(safe-area-inset-top, 0px);
                z-index: 60;
                background: var(--ink);
            }
            a {
                color: inherit;
            }
            :focus-visible {
                outline: 3px solid var(--gold);
                outline-offset: 4px;
            }

            /* ---------- header ---------- */
            .site {
                position: sticky;
                top: env(safe-area-inset-top, 0px);
                z-index: 50;
                background: rgba(255, 246, 229, 0.94);
                -webkit-backdrop-filter: blur(16px);
                backdrop-filter: blur(16px);
                border-bottom: 1px solid rgba(9, 21, 16, 0.12);
                transition:
                    background 0.4s var(--ease),
                    box-shadow 0.4s var(--ease);
            }
            .site.scrolled {
                background: rgba(255, 246, 229, 0.98);
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            }
            .bar {
                max-width: 1280px;
                margin: 0 auto;
                min-height: var(--bar);
                box-sizing: border-box;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                padding-left: max(24px, env(safe-area-inset-left, 0px));
                padding-right: max(24px, env(safe-area-inset-right, 0px));
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
                text-decoration: none;
                white-space: nowrap;
            }
            /* logo slot: swap this span for <img class="logo" src="..." alt=""> to use a real logo file */
            .logo {
                flex: none;
                width: 48px;
                height: 48px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                box-sizing: border-box;
                object-fit: contain;
                border: 1.5px dashed rgba(9, 21, 16, 0.4);
                background: rgba(9, 21, 16, 0.05);
                color: rgba(9, 21, 16, 0.6);
                font-family: var(--body);
                font-size: 8.5px;
                font-weight: 700;
                letter-spacing: 0.12em;
                line-height: 1;
            }
            .brand-text {
                display: flex;
                flex-direction: column;
                gap: 5px;
                line-height: 1;
            }
            .brand-name {
                font-family: var(--display);
                font-weight: 700;
                font-size: 21px;
                letter-spacing: 0.005em;
                color: var(--bg);
            }
            .brand-tag {
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #a9261f;
            }
            .menu {
                display: flex;
                align-items: center;
                gap: clamp(18px, 2.6vw, 38px);
            }
            .menu a {
                position: relative;
                padding: 10px 0;
                font-size: 12.5px;
                font-weight: 600;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                text-decoration: none;
                color: rgba(9, 21, 16, 0.72);
                white-space: nowrap;
                transition: color 0.3s var(--ease);
            }
            .menu a::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                bottom: 3px;
                height: 2px;
                border-radius: 2px;
                background: var(--red);
                transform: scaleX(0);
                transform-origin: left;
                transition: transform 0.45s var(--ease);
            }
            .menu a:hover,
            .menu a[aria-current="true"] {
                color: var(--bg);
            }
            .menu a:hover::after,
            .menu a[aria-current="true"]::after {
                transform: scaleX(1);
            }
            .burger {
                display: none;
                width: 44px;
                height: 44px;
                border: 1px solid rgba(9, 21, 16, 0.24);
                border-radius: 12px;
                background: transparent;
                color: var(--bg);
                cursor: pointer;
                align-items: center;
                justify-content: center;
                padding: 0;
            }
            .burger svg {
                transition: transform 0.4s var(--ease);
            }
            .burger[aria-expanded="true"] svg {
                transform: rotate(90deg);
            }
            @media (max-width: 1080px) {
                .bar {
                    padding-left: max(16px, env(safe-area-inset-left, 0px));
                    padding-right: max(16px, env(safe-area-inset-right, 0px));
                }
                .burger {
                    display: inline-flex;
                }
                .logo {
                    width: 42px;
                    height: 42px;
                }
                .brand-name {
                    font-size: 19px;
                }
                .menu {
                    position: absolute;
                    left: 0;
                    right: 0;
                    top: 100%;
                    flex-direction: column;
                    align-items: stretch;
                    gap: 0;
                    background: rgba(255, 246, 229, 0.98);
                    border-bottom: 1px solid rgba(9, 21, 16, 0.12);
                    box-shadow: 0 18px 30px rgba(0, 0, 0, 0.25);
                    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 14px
                        max(16px, env(safe-area-inset-left, 0px));
                    opacity: 0;
                    visibility: hidden;
                    translate: 0 -10px;
                    transition:
                        opacity 0.35s var(--ease),
                        translate 0.35s var(--ease),
                        visibility 0.35s;
                }
                .menu.open {
                    opacity: 1;
                    visibility: visible;
                    translate: 0 0;
                }
                .menu a {
                    padding: 14px 0;
                    font-size: 14px;
                    border-bottom: 1px solid rgba(9, 21, 16, 0.1);
                }
                .menu a:last-child {
                    border-bottom: 0;
                }
                .menu a::after {
                    display: none;
                }
                .menu a[aria-current="true"] {
                    color: var(--red);
                }
            }

            /* ---------- hero ----------
   One flow-based layout, three sizes. --s scales type and button with the screen.
   Desktop: photo fills the hero, text and button on the left.
   Tablet: text left, photo card right. Phone: photo card on top, then text, then button. */
            .hero {
                --s: min(calc(100vw / 1280), calc((100svh - var(--bar) - 48px) / 640), 1.2px);
                max-width: none;
            }
            .stage {
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                box-sizing: border-box;
                min-height: max(calc(100svh - var(--bar)), 560px);
                padding: 24px clamp(40px, 9vw, 220px);
                background-color: var(--bg);
                background-image: radial-gradient(ellipse 55% 75% at 76% 62%, rgba(242, 193, 78, 0.17), rgba(242, 193, 78, 0) 70%),
                    radial-gradient(ellipse 45% 55% at 8% 96%, rgba(196, 47, 41, 0.16), rgba(196, 47, 41, 0) 70%);
            }
            .photo {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                max-width: none;
                object-fit: cover;
                object-position: 72% 30%;
                z-index: 0;
                animation: bgfade 1.4s var(--ease) both;
            }
            .stage::after {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: linear-gradient(90deg, rgba(9, 21, 16, 0.9) 0%, rgba(9, 21, 16, 0.55) 38%, rgba(9, 21, 16, 0) 68%),
                    linear-gradient(0deg, rgba(9, 21, 16, 0.5) 0%, rgba(9, 21, 16, 0) 35%);
            }
            .snow {
                position: absolute;
                left: 0; top: 0;
                width: 55%; height: 100%;
                z-index: 1;
                pointer-events: none;
                background-image: radial-gradient(circle at 12% 18%, rgba(255,255,255,0.45) 0 2px, transparent 3px),
                    radial-gradient(circle at 31% 9%, rgba(255,255,255,0.35) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 46% 31%, rgba(255,255,255,0.3) 0 2px, transparent 3px),
                    radial-gradient(circle at 6% 47%, rgba(255,255,255,0.3) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 24% 62%, rgba(255,255,255,0.38) 0 2px, transparent 3px),
                    radial-gradient(circle at 39% 78%, rgba(255,255,255,0.28) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 15% 88%, rgba(255,255,255,0.4) 0 2px, transparent 3px);
            }
            .content {
                position: relative;
                z-index: 3;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: calc(var(--s) * 20);
                text-shadow: 0 2px 16px rgba(9, 21, 16, 0.7);
            }
            .copy { display: flex; flex-direction: column; gap: calc(var(--s) * 18); }
            .santa, .branta { margin: 0; display: flex; flex-direction: column; gap: 4px; }
            .santa { animation: rise 0.9s var(--ease) 0.1s both; }
            .label {
                font-size: clamp(11px, calc(var(--s) * 14), 15px);
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }
            .santa .label { color: var(--muted); }
            .branta .label { color: var(--gold); animation: rise 0.9s var(--ease) 0.3s both; }
            .ho {
                font-family: var(--display);
                font-style: italic;
                font-weight: 600;
                font-size: max(26px, calc(var(--s) * 46));
                line-height: 1.1;
                color: rgba(255, 246, 229, 0.7);
                text-decoration: line-through;
                text-decoration-color: var(--red-hot);
                text-decoration-thickness: 3px;
            }
            .no { display: block; font-family: var(--display); font-weight: 900; line-height: 0.92; color: var(--ink); }
            .n1 { font-size: max(36px, calc(var(--s) * 60)); animation: rise 0.9s var(--ease) 0.4s both; }
            .n2 { font-size: max(52px, calc(var(--s) * 88)); animation: rise 0.9s var(--ease) 0.52s both; }
            .n3 {
                font-size: max(70px, calc(var(--s) * 118));
                color: var(--red-hot);
                transform: rotate(-4deg);
                transform-origin: left bottom;
                animation: rise 1s cubic-bezier(0.2, 0.9, 0.3, 1.15) 0.66s both;
            }

            /* pointing Santa sits right on top of the button */
            .unit {
                --pw: clamp(116px, calc(var(--s) * 150), 190px);
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-shadow: none;
            }
            .pointer {
                position: relative;
                z-index: 1;
                width: var(--pw);
                aspect-ratio: 800 / 984;
                overflow: hidden;
                -webkit-mask-image: linear-gradient(to bottom, #000 92%, transparent 100%);
                mask-image: linear-gradient(to bottom, #000 92%, transparent 100%);
                animation: rise 0.9s var(--ease) 0.85s both, float 6s ease-in-out 1.8s infinite;
            }
            .pointer img { display: block; width: 100%; height: auto; }
            .bubble {
                position: absolute;
                z-index: 3;
                left: calc(50% + var(--pw) * 0.3);
                top: calc(var(--pw) * 0.22);
                padding: 9px 16px;
                border-radius: 999px;
                background: var(--ink);
                color: var(--bg);
                font-family: var(--display);
                font-weight: 900;
                font-size: 17px;
                line-height: 1;
                white-space: nowrap;
                transform-origin: left center;
                animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.25) 1.3s both;
            }
            .bubble::after {
                content: "";
                position: absolute;
                left: -8px;
                top: calc(50% - 7px);
                width: 11px;
                height: 14px;
                background: var(--ink);
                clip-path: polygon(100% 0, 0 50%, 100% 100%);
            }
            .ctawrap { position: relative; z-index: 2; margin-top: calc(var(--pw) * -0.06); animation: rise 0.9s var(--ease) 1.05s both; }
            .cta {
                display: flex;
                align-items: center;
                gap: 20px;
                box-sizing: border-box;
                min-height: clamp(52px, calc(var(--s) * 64), 68px);
                padding: 0 8px 0 28px;
                border-radius: 14px;
                background: linear-gradient(180deg, #cc3029, #b02922);
                color: var(--ink);
                font-weight: 600;
                font-size: clamp(15px, calc(var(--s) * 19), 20px);
                letter-spacing: 0.01em;
                text-decoration: none;
                white-space: nowrap;
                box-shadow: inset 0 0 0 1px rgba(255,246,229,0.18), 0 10px 24px rgba(0,0,0,0.4);
                transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), filter 0.35s var(--ease);
            }
            .cta:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: inset 0 0 0 1px rgba(255,246,229,0.26), 0 16px 32px rgba(0,0,0,0.45); }
            .cta:active { transform: translateY(0); }
            .cta .go {
                flex: none;
                align-self: stretch;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 52px;
                margin: 8px 0;
                border-left: 1px solid rgba(255,246,229,0.3);
                transition: transform 0.35s var(--ease);
            }
            .cta:hover .go { transform: translateX(3px); }

            /* tablet: text left, photo card right, both fill the screen height */
            @media (min-width: 700px) and (max-width: 1099px) {
                .hero { --s: min(calc(100vw / 760), 1.2px); }
                .unit { --pw: clamp(150px, calc(var(--s) * 170), 210px); }
                .stage {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                    grid-template-rows: 1fr;
                    gap: clamp(24px, 4vw, 44px);
                    padding: clamp(24px, 4vw, 44px);
                    min-height: max(calc(100svh - var(--bar)), 600px);
                }
                .stage::after, .snow { display: none; }
                .content { grid-column: 1; grid-row: 1; align-self: center; text-shadow: none; }
                .photo {
                    position: relative;
                    inset: auto;
                    grid-column: 2;
                    grid-row: 1;
                    align-self: center;
                    width: 100%;
                    height: auto;
                    aspect-ratio: 5 / 6;
                    max-height: calc(100svh - var(--bar) - 80px);
                    border-radius: 20px;
                    object-position: 66% 30%;
                    box-shadow: 0 0 0 1px rgba(255,246,229,0.16), 0 24px 48px rgba(0,0,0,0.45);
                }
            }

            /* phone: photo card on top, then text, then the pointing Santa and button */
            @media (max-width: 699px) {
                .hero { --s: min(calc(100vw / 540), 1.1px); }
                .stage {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 22px;
                    min-height: 0;
                    padding: 16px 0 36px;
                }
                .stage::after, .snow { display: none; }
                .photo {
                    position: relative;
                    inset: auto;
                    order: 1;
                    width: calc(100% - 32px);
                    height: auto;
                    aspect-ratio: 4 / 3;
                    margin: 0 auto;
                    border-radius: 18px;
                    object-position: 80% 30%;
                    box-shadow: 0 0 0 1px rgba(255,246,229,0.16), 0 18px 36px rgba(0,0,0,0.45);
                }
                .content { order: 2; padding: 0 24px; text-shadow: none; gap: 26px; }
                .unit { align-self: center; }
                .cta { white-space: normal; padding-left: 22px; gap: 14px; font-size: clamp(14px, 3.8vw, 18px); }
                .unit { --pw: clamp(140px, 38vw, 190px); }
            }

            /* ---------- phone + tablet hero (<=1099px). Desktop (1100px and up) is untouched: the
               extra images/text below are display:none there. ---------- */
            .m-bg, .m-branta, .bt-m { display: none; }
            @media (max-width: 1099px) {
                .stage {
                    --mpad: clamp(20px, 4.5vw, 48px);
                    display: flex;
                    flex-direction: column;
                    align-items: stretch;
                    min-height: max(calc(100svh - var(--bar)), 600px);
                    padding: 20px 0 28px;
                    gap: 0;
                    background-image: none;
                    isolation: isolate;
                }
                .photo { display: none; }
                .m-bg {
                    display: block;
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    max-width: none;
                    object-fit: cover;
                    object-position: 50% 50%;
                    z-index: 0;
                    animation: bgfade 1.2s var(--ease) both;
                }
                .stage::after {
                    display: block;
                    background: linear-gradient(180deg, rgba(9, 21, 16, 0.35) 0%, rgba(9, 21, 16, 0) 45%, rgba(9, 21, 16, 0.3) 100%);
                }
                /* Branta cut-out, top right of the text block, fading out at the bottom edge */
                .m-branta {
                    display: block;
                    position: absolute;
                    top: -6px;
                    right: calc(var(--mpad) * -1);
                    width: min(53vw, 460px);
                    max-width: none;
                    height: auto;
                    z-index: 2;
                    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
                    mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
                    animation: rise 1s var(--ease) 0.4s both;
                }
                /* text group, then Welcome Santa + button; the whole group is centred vertically */
                .content {
                    flex: 1 1 auto;
                    width: 100%;
                    box-sizing: border-box;
                    padding: 0 max(var(--mpad), env(safe-area-inset-right, 0px)) 0 max(var(--mpad), env(safe-area-inset-left, 0px));
                    align-self: auto;
                    align-items: stretch;
                    justify-content: center;
                    gap: 28px;
                    z-index: 3;
                    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
                }
                .copy { position: relative; }
                /* Christmas-inspired type for the headline and the bubble */
                .ho, .no, .bubble { font-family: "Mountains of Christmas", var(--display); }
                .ho { font-style: normal; font-weight: 700; font-size: clamp(22px, 6.4vw, 54px); }
                .no { font-weight: 700; line-height: 1; }
                .n1 { font-size: clamp(34px, 10.4vw, 82px); }
                .n2 { font-size: clamp(46px, 14vw, 112px); }
                .n3 { font-size: clamp(60px, 18vw, 146px); }
                /* Welcome Santa + button: left-aligned, directly under the text */
                .unit { --pw: clamp(140px, 38vw, 250px); width: fit-content; max-width: 100%; align-self: flex-start; align-items: flex-start; margin: 0; }
                .bubble {
                    left: calc(var(--pw) * 0.8);
                    width: max-content;
                    max-width: calc(100% - var(--pw) * 0.8);
                    box-sizing: border-box;
                    white-space: normal;
                    text-align: center;
                    border-radius: 22px;
                    font-size: clamp(15px, 4.2vw, 26px);
                    line-height: 1.1;
                }
                .bt-d { display: none; }
                .bt-m { display: inline; }
                .ctawrap { width: 100%; }
                .cta {
                    width: 100%;
                    min-height: 56px;
                    justify-content: space-between;
                    font-size: clamp(14px, 4vw, 20px);
                    padding-left: 22px;
                    white-space: normal;
                }
            }
            /* tablet: the bubble may extend past the (narrower) button so its text stays on one line */
            @media (min-width: 700px) and (max-width: 1099px) {
                .bubble { max-width: calc(100vw - var(--mpad) * 2 - var(--pw) * 0.8); }
            }

            @keyframes rise { from { opacity: 0; translate: 0 22px; } to { opacity: 1; translate: 0 0; } }
            @keyframes bgfade { from { opacity: 0; } to { opacity: 1; } }
            @keyframes pop { from { opacity: 0; scale: 0.6; } to { opacity: 1; scale: 1; } }
            @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

            @media (prefers-reduced-motion: reduce) {
                html { scroll-behavior: auto; }
                *, *::before, *::after { animation: none !important; transition: none !important; }
            }
        </style>

        <header class="site" id="top">
            <div class="bar">
                <a class="brand" href="#home" aria-label="Branta Claus, The Branti-establishment: home">
                    <span class="logo" aria-hidden="true"
                        ><svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="4" width="18" height="16" rx="2.5" />
                            <circle cx="9" cy="10" r="1.8" />
                            <path d="M4 18l5.5-5 4 3.5 3-2.5L21 17" /></svg
                        >LOGO</span
                    >
                    <span class="brand-text">
                        <span class="brand-name">Branta Claus</span>
                        <span class="brand-tag">The Branti-establishment</span>
                    </span>
                </a>
                <button
                    class="burger"
                    id="burger"
                    type="button"

        <script>
            (function () {
                var hdr = document.querySelector(".site");
                var burger = document.getElementById("burger");
                var menu = document.getElementById("menu");
                function onScroll() {
                    hdr.classList.toggle("scrolled", window.scrollY > 8);
                }
                window.addEventListener("scroll", onScroll, { passive: true });
                onScroll();
                function setMenu(open) {
                    menu.classList.toggle("open", open);
                    burger.setAttribute("aria-expanded", open ? "true" : "false");
                    burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
                }
                burger.addEventListener("click", function () {
                    setMenu(!menu.classList.contains("open"));
                });
                Array.prototype.forEach.call(menu.querySelectorAll("a"), function (a) {
                    a.addEventListener("click", function () {
                        setMenu(false);
                    });
                });
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") setMenu(false);
                });
            })();
        </script>
